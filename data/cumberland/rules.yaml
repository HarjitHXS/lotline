# ---------- Submission checklists, each item with its source ----------
documents:
  note: "Appendix D was last posted 07-01-2015, and the 2024 amendments say applicants submit 'the items identified in the checklist'. Ask Planning for the current checklist and treat this list as a starting point."
  general_plan_requirements:
    title: "Every plan set (Appendix D, Article A)"
    items:
      - {t: "Title block: project name, submission type/stage, owner and applicant names and addresses, plat and lot numbers, plan date and revisions, PE or surveyor name and RI registration number, graphic scale and north arrow", c: "App. D Art. A(1)"}
      - {t: "General notes: zoning classification, total area, minimum area/frontage/dimensions/setbacks, wetlands (say 'none' if none), easements (say 'none' if none)", c: "App. D Art. A(2)"}
      - {t: "Legend: existing and proposed property lines and setbacks, structures, utilities, manholes, catch basins", c: "App. D Art. A(3)"}
      - {t: "Sheets 18x24 or 24x36 for the Planning file (11x17 reductions for distribution), numbered in sequence", c: "App. D Art. A(4)"}
      - {t: "Location map showing the project within 1/2 mile, with streams, ponds, wetlands, reservoirs and public wells within 1,000 ft", c: "App. D Art. A(5)"}
  pre_application:
    title: "Pre-application sketch plan (Appendix D, Article C)"
    items:
      - {t: "Completed application and fee (see fees)", c: "App. D Art. C(1)(a)"}
      - {t: "At least 15 prints of the sketch plan. File no less than 14 days before the Planning Board meeting", c: "App. D Art. C(1)(b)"}
      - {t: "Existing and proposed lot areas and dimensions, and streets", c: "Art. C(2)(a)"}
      - {t: "Existing buildings, structures and utilities on the lot and on abutting lots", c: "Art. C(2)(b)"}
      - {t: "Platted streets next to the parcel, with width and names", c: "Art. C(2)(c)"}
      - {t: "Easements and proposed deed restrictions (say 'none' if none)", c: "Art. C(2)(d)"}
      - {t: "Scale no smaller than 1 in = 80 ft; phasing plan (or 'none'); approximate topography", c: "Art. C(2)(e)-(h)"}
      - {t: "Approximate wetlands and water bodies; private wells and septic systems within 200 ft", c: "Art. C(2)(j)-(k)"}
  preliminary_plan:
    title: "Preliminary plan (Appendix D, Article E)"
    items:
      - {t: "Completed preliminary application and filing fee", c: "App. D Art. E(1)(a)"}
      - {t: "At least 20 prints of the preliminary plan. File no less than 14 days before the Planning Board meeting", c: "Art. E(1)(b)"}
      - {t: "Certification from the water supplier that water can be provided (Pawtucket Water Supply Board serves Valley Falls; Cumberland Water serves north of Marshall Ave)", c: "Art. E(1)(e)"}
      - {t: "Certification from Cumberland Public Works that the sewer layout is acceptable and can take the project's flow", c: "Art. E(1)(f)"}
      - {t: "Advisory report from the Police Traffic Officer on traffic control signs and devices", c: "Art. E(1)(g)"}
      - {t: "Notarized owner authorization if the owner is not the applicant", c: "Art. E(1)(h)"}
      - {t: "Abutters' names and addresses on two sets of self-adhesive mailing labels", c: "Art. E(2)(h)"}
      - {t: "Ground elevations and FEMA floodplains; contours at 2-ft intervals; wetland and stream setbacks within 200 ft", c: "Art. E(2)(j)-(k)"}
      - {t: "Existing and proposed water, sewer and drainage lines, manholes and catch basins, with sizing data", c: "Art. E(2)(n)"}
      - {t: "Easements, covenants and draft legal documents (or 'none')", c: "Art. E(2)(o)"}
      - {t: "Curb lines and driveway openings; hydrants; wells and septic systems within 200 ft", c: "Art. E(2)(p), (r)-(t)"}
      - {t: "Soil erosion and sedimentation control plan; stormwater controls with design data", c: "Art. E(2)(u), (w)"}
      - {t: "Landscape plan by a RI-registered Landscape Architect (trees 16 in. or larger within 50 ft of the right-of-way)", c: "Art. E(2)(aa)"}
      - {t: "Street lighting plan (existing lights within 50 ft and proposed lights)", c: "Art. E(2)(bb)"}
      - {t: "All needed state and federal permits; DEM wetlands determination if wetlands are present", c: "Art. E(2)(cc), (ee)"}
  master_plan:
    title: "Master plan, major projects (Appendix D, Article D)"
    items:
      - {t: "Completed application and fee; at least 20 prints, filed no less than 14 days before the meeting", c: "App. D Art. D(1)"}
      - {t: "Total area of lots and roadways; topography and existing structures and natural features on the site and abutting lots", c: "Art. D(2)(a)-(b)"}
      - {t: "Tentative construction phasing; analysis of neighborhood and district impacts", c: "Art. D(2)(c)-(d)"}
      - {t: "DEM wetland edge verification, or 'no wetlands' on the plan", c: "Art. D(2)(e)"}
      - {t: "Buildable-area analysis with a constraint plan (wetlands, slopes over 15%, easements, 100-year floodplain)", c: "Art. D(2)(f)"}
      - {t: "Abutters' names and addresses on mailing labels", c: "Art. D(2)(g)"}
  final_plan:
    title: "Final plan (Appendix D, Article F)"
    items:
      - {t: "Completed final application and fee; at least 15 prints (2 on Mylar), filed no less than 14 days before the meeting", c: "App. D Art. F(1)(a)-(b)"}
      - {t: "Municipal lien certificate showing no taxes are due", c: "Art. F(1)(d)"}
      - {t: "Deeds, easements and covenants; statement describing easements (in duplicate)", c: "Art. F(1)(f)-(g), (n)"}
      - {t: "PE certification that drainage handles a 100-year storm", c: "Art. F(1)(h)"}
      - {t: "The approved preliminary plan showing every change the Board directed; state and federal permits obtained or changed", c: "Art. F(1)(l)-(m)"}
      - {t: "Surveyor certification that the plat is correct; engineer certification of stormwater provisions", c: "Art. F(2)(e)"}
      - {t: "Construction schedule or financial guarantees for public improvements, and tax collector certification (minor projects)", c: "§ 5-G(j) in Appendix A"}
  zoning_modification:
    title: "Modification request to the Zoning Officer (Appendix B, § 18-4)"
    items:
      - {t: "Written request that says which dimension (lot area, setback, etc.) and by what percent it falls short. Limit is 15%", c: "App. B § 18-4(a)"}
      - {t: "Plan or survey showing the dimension. Ask the Zoning Officer for the current form", c: "App. B § 17-10"}
      - {t: "Reasons for each suitability test: needed for full enjoyment of the permitted use; neighbors not substantially injured; no wetlands rule violated; no flood-hazard variance needed", c: "App. B § 18-4(b)(1)-(4)"}
      - {t: "If more than 5%: abutters are notified by first-class mail and a newspaper notice runs; 14 days for written objections. An objection sends it to the Zoning Board as a variance", c: "App. B § 18-4(c)-(d)"}
  variance:
    title: "Dimensional variance evidence (RIGL § 45-24-41; Appendix B § 18-2)"
    items:
      - {t: "The hardship comes from unique characteristics of this land or building, not from the neighborhood in general, and not from a physical or economic disability of the applicant", c: "RIGL § 45-24-41(d)(1)"}
      - {t: "The hardship is not the result of any prior action of the applicant", c: "RIGL § 45-24-41(d)(2)"}
      - {t: "The variance will not alter the general character of the area or impair the intent of the zoning ordinance or comprehensive plan", c: "RIGL § 45-24-41(d)(3)"}
      - {t: "The hardship is more than a mere inconvenience: the relief sought is minimal to a reasonable enjoyment of the permitted use. More profit is not grounds", c: "RIGL § 45-24-41(e)(2)"}
      - {t: "Notice: 14 days' newspaper notice and first-class mail to abutters, with a notarized affidavit of mailing. The applicant pays for notice", c: "RIGL § 45-24-41(b)"}
      - {t: "Owner(s) must join the application; a corporation signs by its attorney or authorized officer", c: "App. B § 18-1(a)"}
      - {t: "Expert report (planner, surveyor or engineer) that addresses each standard. Providence applicants file one; the pack's Case C is an example", c: "Practice, not a code requirement"}
  building_permit_adu:
    title: "ADU building permit package (Appendix B § 6-6)"
    items:
      - {t: "Floor plans showing a complete, independent living unit (kitchen, bath, sleeping area) with up to 2 bedrooms", c: "App. B § 6-6(c)-(d)"}
      - {t: "Calculation that the ADU is no more than 60% of the main house's floor area and no more than 900 sq ft (studio/1 BR) or 1,200 sq ft (2 BR)", c: "§ 6-6(g)"}
      - {t: "Site plan showing the ADU and the main house meet the Article 5 setbacks and lot coverage for the zone, and showing 1 off-street parking space per bedroom", c: "§ 6-6(e), (h)"}
      - {t: "Proof that one by-right condition is met: lot of 20,000 sq ft or more; or inside the existing footprint; or disability accommodation in an owner-occupied home", c: "§ 6-6(a); RIGL § 45-24-73"}
      - {t: "A statement that the ADU will not be used as a short-term or transient rental", c: "§ 6-6(j)"}
      - {t: "Septic or sewer approval for the added bedrooms (DEM if on septic; town sewer if connected)", c: "§ 6-6(f)"}
      - {t: "Ask the Building Official for the current permit application and plan requirements. The code doesn't list them", c: "App. B § 17-10"}
  building_permit_general:
    title: "Building permit package (two-family conversion or new build)"
    items:
      - {t: "Survey or site plan showing setbacks, lot coverage and parking for the zone", c: "App. B § 5-2"}
      - {t: "Floor plans and elevations showing the number of units; height within 35 ft", c: "App. B § 5-2"}
      - {t: "Zoning certificate or written zoning determination from the Zoning Officer", c: "App. B § 17-10; RIGL § 45-24-54"}
      - {t: "Sewer or septic approval and water service confirmation", c: "App. B § 5-2; Ch. 40"}
      - {t: "Ask the Building Official for the current permit application and plan requirements. The code doesn't list them", c: "App. B § 17-2"}

