adu:
  cite: "Appendix B § 6-6; R.I. Gen. Laws § 45-24-73"
  by_right_if: ["Owner-occupied, as a reasonable accommodation for a family member with a disability",
                "Lot is 20,000 sq ft or more and the primary use is residential",
                "Inside the existing footprint of the house or an existing accessory building, without expanding it"]
  limits: ["One ADU per lot, on a lot with a single-family or multifamily dwelling (§ 6-6(a)-(b))",
           "Up to 2 bedrooms (§ 6-6(d))",
           "1 off-street parking space per bedroom (§ 6-6(e))",
           "Size: the lesser of 60% of the main house's floor area or 900 sq ft (studio/1 BR) / 1,200 sq ft (2 BR) (§ 6-6(g))",
           "Must meet Article 5 dimensional rules, except no zoning relief is needed inside an existing legal nonconforming footprint (§ 6-6(h)-(i))",
           "No short-term or transient rental (§ 6-6(j))"]

thresholds:
  cite: "Appendix A § 2 definitions"
  minor_ld_max_units: 9          # "Multifamily residential ... development of nine units or less"
  minor_sub_max_lots: 9
  modification_max_pct: 15       # § 18-4(a)
  modification_no_notice_pct: 5  # § 18-4(c)

timelines:
  minor_certify_days: "25 days (15 if no street is created or extended) for the Administrative Officer to certify the application complete or incomplete, § 5-G(d)"
  minor_decision_admin: "65 days after certified complete, decided by the Administrative Officer, § 5-G(g)"
  minor_decision_board: "95 days after certified complete, decided by the Planning Board after a public hearing (if zoning relief/UDR or a new street), § 5-G(g)"
  minor_expiry: "Approval expires one year from the date of approval unless recorded or extended, § 5-G(k)"
  major_stages: "Pre-application meeting (required), Master Plan with public hearing, Preliminary Plan, then Final Plan, § 5-E and § 5-H"
  major_certify: "25 days to certify each stage complete or incomplete, § 5-H"
  modification: "Zoning Officer decides suitability within 10 days. Over 5%: abutters get notice and have 14 days to object; an objection sends it to the Zoning Board, § 18-4"
  failure_to_act: "If the Planning Board or Administrative Officer misses the deadline, the preliminary plan is approved by law, § 5-G(h)"

