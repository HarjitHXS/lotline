# ---------- Contact tasks: calls and emails to make, shown in the approval checklist ----------
# when: always | ld (land development or mixed-use) | relief | sewer | historic | adu_or_two | water_any
contact_tasks:
  - id: planning_pre
    phase: talk
    kind: town
    contact: "Amelia Morton"
    when: always
    title: "Ask Planning which review applies to your project"
    detail: "A short call or email now can save a resubmission. Staff tell you whether this is a building permit only, a modification, a minor land development or a major one."
    asks:
      - "Which review applies to my project, and who decides it?"
      - "Can we schedule a pre-application meeting? (Required for major projects, optional for others.)"
      - "Please send the current submission checklist. The posted Appendix D is dated 2015."
      - "What is the next filing deadline? The 2026 schedule has none left."
    expect: "Email or notes from the call"
    cite: "Appendix A § 5-E"
  - id: clerk_forms
    phase: talk
    kind: town
    contact: "Frank Polidoro"
    when: ld
    title: "Get the current forms, number of copies and filing deadline"
    detail: "The Planning Clerk is named in the 2026 schedule as the person who helps applicants prepare."
    asks:
      - "Where do I file, and are applications submitted on paper, through the OpenGov portal, or both?"
      - "How many plan copies and what sheet size do you want today?"
      - "What are the current fees? (The posted schedule is dated 2015.)"
    expect: "Application form or fee sheet"
    cite: "2026 TRC / Planning Board schedule"
  - id: zoning_relief
    phase: talk
    kind: town
    contact: "Building Official / Zoning Officer"
    when: relief
    title: "Ask the Zoning Officer about a modification or variance"
    detail: "Your numbers show relief is needed. A modification of up to 15% is decided by the Zoning Officer. Anything bigger goes to the Zoning Board or the Planning Board."
    asks:
      - "Does my shortfall qualify for a modification (up to 15%)?"
      - "Which form do I use, and what is the filing fee?"
      - "Who must I notify, and do you prepare the abutter list?"
    expect: "Modification or variance application form"
    cite: "Appendix B § 18-4, § 17-10"
  - id: historic
    phase: talk
    kind: town
    contact: "Amelia Morton"
    when: historic
    title: "Ask about the Historic District Commission"
    detail: "The lot is inside a historic district overlay. Exterior changes need a Certificate of Appropriateness."
    asks:
      - "Which exterior work needs a Certificate of Appropriateness?"
      - "When does the Commission meet, and what do I file?"
    expect: "Commission application"
    cite: "Appendix B § 8-6"
  - id: sewer_letter
    phase: talk
    kind: sewer
    contact: "Sewer Superintendent"
    when: sewer
    title: "Get written confirmation of sewer service"
    detail: "The sewer map in this tool is a planning map from about 2012. Only Public Works can say whether this lot is connected. Planning needs this letter for land development plans."
    asks:
      - "Is the building connected to town sewer, and which main serves it?"
      - "Can you send a sewer availability letter for this lot and project?"
      - "Is there a sewer connection permit or sewer-use account on file? Is any capacity limit known?"
    expect: "Sewer availability letter"
